<!--
README: SQL Configuration Generator

HOW TO RUN:
1. Open this file (index.html) in any modern web browser (or use a local server, e.g. python -m http.server 8080)
2. All saved configurations are stored in Firebase and shared automatically
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Configuration Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header with StoreNos -->
        <header>
            <div class="header-content">
                <div class="header-title-section">
                    <h1>SQL Configuration Generator</h1>
                </div>
                <div class="store-nos-input">
                    <label for="globalStoreNos">StoreNos (optional)</label>
                    <input type="text" id="globalStoreNos" placeholder="123, 456 or 100-105">
                    <span id="storeNosCount" class="store-count"></span>
                </div>
            </div>
        </header>

        <!-- Tab Navigation -->
        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="jsonset" onclick="switchTab('jsonset')">JSON_SET Generator</button>
            <button class="tab-btn" data-tab="saved" onclick="switchTab('saved')">Saved Configurations</button>
            <button class="tab-btn" data-tab="freesql" onclick="switchTab('freesql')">Free SQL</button>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- Tab 1: JSON_SET Generator -->
            <section id="tab-jsonset" class="tab-content active">
                <div class="card">
                    <form id="quickGeneratorForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="stationId">StationId</label>
                                <input type="text" id="stationId" value="Dispatch" placeholder="Dispatch">
                            </div>
                        </div>
                        
                        <div id="pathValueRows">
                            <div class="path-value-row" data-index="0">
                                <div class="form-group path-group">
                                    <label>JSON Path</label>
                                    <input type="text" class="json-path" placeholder="$.configKey">
                                </div>
                                <div class="form-group value-group">
                                    <label>Value</label>
                                    <input type="text" class="json-value" placeholder="true">
                                </div>
                                <div class="form-group type-group">
                                    <label>Type</label>
                                    <select class="value-type">
                                        <option value="boolean">Boolean</option>
                                        <option value="string">String</option>
                                        <option value="number">Number</option>
                                        <option value="null">Null</option>
                                    </select>
                                </div>
                                <button type="button" class="btn-icon btn-remove-row" title="Remove" style="visibility: hidden;">×</button>
                            </div>
                        </div>
                        
                        <button type="button" class="btn btn-link" id="addPathValueBtn">+ Add another path/value</button>
                        
                        <!-- Advanced Options -->
                        <details class="advanced-section">
                            <summary>Advanced Options</summary>
                            <div class="advanced-grid">
                                <div class="form-group">
                                    <label for="tableName">Table Name</label>
                                    <input type="text" id="tableName" value="StoreStations">
                                </div>
                                <div class="form-group">
                                    <label for="configColumn">Config Column</label>
                                    <input type="text" id="configColumn" value="Configuration">
                                </div>
                                <div class="form-group">
                                    <label for="stationColumn">Station Column</label>
                                    <input type="text" id="stationColumn" value="StationId">
                                </div>
                                <div class="form-group">
                                    <label for="storeColumn">Store Column</label>
                                    <input type="text" id="storeColumn" value="StoreNo">
                                </div>
                            </div>
                        </details>
                        
                        <div class="form-actions">
                            <button type="button" class="btn btn-primary btn-large" onclick="generateFromQuickForm()">Generate SQL</button>
                            <button type="button" class="btn btn-secondary" onclick="openSaveModal('json_set')">Save as Config</button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Tab 2: Saved Configurations -->
            <section id="tab-saved" class="tab-content">
                <div class="card">
                    <div class="card-header">
                        <input type="text" id="searchConfigs" placeholder="Search configurations..." class="search-input">
                    </div>
                    <div id="configsGrid" class="configs-grid">
                        <p class="empty-state">No saved configurations yet.</p>
                    </div>
                </div>
            </section>

            <!-- Tab 3: Free SQL -->
            <section id="tab-freesql" class="tab-content">
                <div class="card">
                    <form id="freeSqlForm">
                        <div class="form-group">
                            <label for="freeSqlInput">Paste any SQL script</label>
                            <textarea id="freeSqlInput" rows="8" placeholder="Paste your SQL here..." class="code-input"></textarea>
                        </div>
                        <div class="form-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="appendStoreFilter">
                                Append StoreNo filter
                            </label>
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn btn-primary btn-large" onclick="generateFromFreeSql()">Generate SQL</button>
                            <button type="button" class="btn btn-secondary" onclick="openSaveModal('free_sql')">Save as Config</button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Output Section (always visible when has content) -->
            <section id="outputSection" class="output-section" style="display: none;">
                <div class="card output-card">
                    <div class="card-header">
                        <h3>Generated SQL</h3>
                        <div class="output-controls">
                            <button id="copyBtn" class="btn btn-primary btn-small" onclick="copyToClipboard()">Copy</button>
                            <button id="clearBtn" class="btn btn-secondary btn-small" onclick="clearOutput()">Clear</button>
                        </div>
                    </div>
                    <pre id="sqlOutput" class="sql-output"></pre>
                    <div id="copyConfirmation" class="copy-confirmation" style="display: none;">Copied!</div>
                </div>
            </section>

        </main>
    </div>

    <!-- Modal for Save Config -->
    <div id="saveConfigModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Save Configuration</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div style="padding: 20px;">
                <div class="form-group">
                    <label for="configTitle">Title *</label>
                    <input type="text" id="configTitle" placeholder="My Config">
                </div>
                <div class="form-group">
                    <label for="configDescription">Description (optional)</label>
                    <textarea id="configDescription" rows="2" placeholder="Brief description..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveConfig()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <script src="actions.js"></script>
    <script src="app.js"></script>
</body>
</html>
